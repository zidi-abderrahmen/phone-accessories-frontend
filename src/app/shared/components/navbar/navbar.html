<header class="pa-nav">
  <div class="pa-nav__container">
    <a routerLink="/" class="pa-nav__brand" aria-label="Phone Accessories — home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="2" width="12" height="20" rx="3"></rect>
        <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"></line>
      </svg>
      <span>Phone Accessories</span>
    </a>

    <nav class="pa-nav__links" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="pa-nav__link--active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          class="pa-nav__link"
        >{{ link.label }}</a>
      }
      @if (isAdmin()) {
        <a routerLink="/admin/dashboard" routerLinkActive="pa-nav__link--active" class="pa-nav__link">Admin</a>
      }
    </nav>

    <div class="pa-nav__search">
      <label for="pa-nav-search-input" class="pa-sr-only">Search accessories</label>
      <input
        id="pa-nav-search-input"
        type="search"
        placeholder="Search accessories…"
        (keydown.enter)="onSearch($event)"
      >
    </div>

    <div class="pa-nav__actions">
      <div class="pa-nav__desktop-actions">
        <button
          type="button"
          class="pa-nav__action"
          (click)="toggleTheme()"
          [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
        >
          @if (isDarkTheme()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
          }
        </button>

        @if (isAuthenticated()) {
          <a routerLink="/wishlist" class="pa-nav__action" aria-label="View wishlist">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path>
            </svg>
          </a>

          <a routerLink="/my-cart" class="pa-nav__action" aria-label="View cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
          </a>

          <app-account-menu [user]="currentUser()" [initials]="initials(currentUser())" (logout)="logout()"></app-account-menu>
        } @else {
          <a routerLink="/login" class="pa-btn pa-btn--ghost pa-btn--sm">Log in</a>
          <a routerLink="/register" class="pa-btn pa-btn--primary pa-btn--sm">Register</a>
        }
      </div>

      <button
        type="button"
        class="pa-nav__hamburger"
        (click)="toggleDrawer()"
        aria-label="Open menu"
        [attr.aria-expanded]="isDrawerOpen()"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<app-mobile-drawer
  [open]="isDrawerOpen()"
  [links]="navLinks"
  [isAuthenticated]="isAuthenticated()"
  [isAdmin]="isAdmin()"
  [isDarkTheme]="isDarkTheme()"
  (closed)="closeDrawer()"
  (logout)="logout()"
  (themeToggled)="toggleTheme()"
></app-mobile-drawer>
