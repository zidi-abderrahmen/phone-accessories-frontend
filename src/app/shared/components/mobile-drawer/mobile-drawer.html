<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
@if (open()) {
    <div class="pa-drawer__backdrop" (click)="closed.emit()"></div>
    <aside class="pa-drawer" aria-label="Mobile navigation">
    <button type="button" class="pa-drawer__theme-toggle" (click)="themeToggled.emit()">
        <span>{{ isDarkTheme() ? 'Dark mode' : 'Light mode' }}</span>
        @if (isDarkTheme()) {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        </svg>
        }
    </button>

    <hr class="pa-drawer__divider" />

    <nav class="pa-drawer__section">
        @for (link of links(); track link.path) {
        <a
            [routerLink]="link.path"
            routerLinkActive="pa-drawer__link--active"
            [routerLinkActiveOptions]="{ exact: !!link.exact }"
            class="pa-drawer__link"
            (click)="closed.emit()"
        >{{ link.label }}</a>
        }
        @if (isAdmin()) {
        <a routerLink="/admin/dashboard" class="pa-drawer__link" (click)="closed.emit()">Admin</a>
        }
    </nav>

    <hr class="pa-drawer__divider" />

    @if (isAuthenticated()) {
        <nav class="pa-drawer__section">
        <a routerLink="/wishlist" class="pa-drawer__link" (click)="closed.emit()">Wishlist</a>
        <a routerLink="/my-cart" class="pa-drawer__link" (click)="closed.emit()">Cart</a>
        @for (link of accountLinks; track link.path) {
            <a [routerLink]="link.path" class="pa-drawer__link" (click)="closed.emit()">{{ link.label }}</a>
        }
        <button type="button" class="pa-drawer__link pa-drawer__link--danger" (click)="onLogout()">Logout</button>
        </nav>
    } @else {
        <div class="pa-drawer__section pa-drawer__actions">
        <a routerLink="/login" class="pa-btn pa-btn--ghost" (click)="closed.emit()">Log in</a>
        <a routerLink="/register" class="pa-btn pa-btn--primary" (click)="closed.emit()">Register</a>
        </div>
    }
    </aside>
}
