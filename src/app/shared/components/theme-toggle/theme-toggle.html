<button
  type="button"
  class="pa-theme-toggle"
  (click)="toggleTheme()"
  [attr.aria-label]="isDarkTheme() ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.aria-pressed]="isDarkTheme()"
  [attr.title]="isDarkTheme() ? 'Switch to light mode' : 'Switch to dark mode'"
>
  <span class="pa-theme-toggle__icon" aria-hidden="true">
    @if (!isDarkTheme()) {
      <!-- Moon icon (dark mode inactive — clicking switches to dark) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    } @else {
      <!-- Sun icon (dark mode active — clicking switches to light) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/>
        <path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/>
        <path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/>
        <path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/>
        <path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    }
  </span>
</button>
