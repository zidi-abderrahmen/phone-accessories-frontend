<section class="pa-not-found" role="main" aria-label="Page not found">
  <div class="pa-container pa-not-found__container">

    <div class="pa-not-found__content pa-animate-fade-up">

      <!-- Brand Visual -->
      <div class="pa-not-found__visual">
        <svg
          class="pa-not-found__visual-svg"
          viewBox="0 0 120 200"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect x="18" y="8" width="84" height="184" rx="16" stroke="currentColor" stroke-width="2.8"/>
          <circle cx="60" cy="92" r="24" stroke="currentColor" stroke-width="2.8"/>
          <line x1="78" y1="110" x2="96" y2="128" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <line x1="42" y1="28" x2="78" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
          <circle cx="60" cy="172" r="5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>

      <!-- Error Code -->
      <h1 class="pa-not-found__code">404</h1>

      <!-- Title -->
      <h2 class="pa-not-found__title">Page not found</h2>

      <!-- Message -->
      <p class="pa-not-found__message">
        The page you are looking for does not exist or may have been moved.
        Let us get you back on track.
      </p>

      <!-- Recovery Actions -->
      <nav class="pa-not-found__actions" aria-label="Recovery navigation">
        <button
          type="button"
          class="pa-btn pa-btn--primary pa-not-found__btn"
          (click)="goHome()"
        >
          <svg
            class="pa-not-found__btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Back to Home
        </button>

        <button
          type="button"
          class="pa-btn pa-btn--secondary pa-not-found__btn"
          (click)="browseCategories()"
        >
          <svg
            class="pa-not-found__btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="7" height="7" x="3" y="3" rx="1"/>
            <rect width="7" height="7" x="14" y="3" rx="1"/>
            <rect width="7" height="7" x="14" y="14" rx="1"/>
            <rect width="7" height="7" x="3" y="14" rx="1"/>
          </svg>
          Browse Categories
        </button>

        <button
          type="button"
          class="pa-btn pa-btn--ghost pa-not-found__btn"
          (click)="viewAccessories()"
        >
          <svg
            class="pa-not-found__btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m7.5 4.27 9 5.15"/>
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
          View Accessories
        </button>
      </nav>

    </div>

  </div>
</section>
