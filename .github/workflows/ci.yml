name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Create development environment file
        run: cp src/environments/environment.development.ts.example src/environments/environment.development.ts
      - run: npm test -- --watch=false
      - run: npm run build

  deploy-worker:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the backend repository
        # The backend is a separate *private* repo, so the default GITHUB_TOKEN
        # cannot read it. Add a PAT with `Contents: read` on
        # zidi-abderrahmen/phone-accessories-backend as the
        # BACKEND_ACCESS_TOKEN repository secret.
        uses: actions/checkout@v4
        with:
          repository: zidi-abderrahmen/phone-accessories-backend
          path: _backend
          token: ${{ secrets.BACKEND_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Create development environment file
        run: cp src/environments/environment.development.ts.example src/environments/environment.development.ts
      - name: Boot the full stack
        env:
          BACKEND_CONTEXT: ${{ github.workspace }}/_backend
        run: docker compose up --build -d
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/actuator/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Backend never became healthy"
          docker compose logs backend || true
          exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run the E2E happy path
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: E2eAdminPassword123!
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v --remove-orphans